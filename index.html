<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SITRI-SIPH 晶圆流转系统</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; display: flex; justify-content: center; min-height: 100vh; }
    .container { background: #fff; max-width: 1300px; width: 100%; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); padding: 28px; }
    h1 { font-size: 24px; text-align: center; margin-bottom: 24px; color: #1a1a1a; }
    
    .tabs { display: flex; border-bottom: 2px solid #e8e8e8; margin-bottom: 24px; }
    .tab { padding: 12px 24px; cursor: pointer; font-size: 16px; font-weight: 600; color: #666; border-bottom: 2px solid transparent; margin-bottom: -2px; }
    .tab.active { color: #1677ff; border-bottom-color: #1677ff; }

    .content { display: none; }
    .content.active { display: block; }

    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 16px; margin-bottom: 20px; }
    .form-group { display: flex; flex-direction: column; }
    label { font-size: 13px; color: #555; margin-bottom: 6px; font-weight: 500;}
    input, select, textarea { padding: 10px; border: 1px solid #d9d9d9; border-radius: 6px; font-size: 14px; outline: none; }
    input:focus, select:focus, textarea:focus { border-color: #1677ff; }
    textarea { resize: vertical; min-height: 60px; }
    button { padding: 10px 20px; background: #1677ff; color: #fff; border: none; border-radius: 6px; font-size: 15px; cursor: pointer; }
    button:hover { background: #0958d9; }

    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: left; }
    th, td { padding: 12px 10px; border-bottom: 1px solid #f0f0f0; }
    th { background: #fafafa; font-weight: 600; color: #333; white-space: nowrap; }
    tr:hover { background: #fcfcfc; }
    
    .badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; white-space: nowrap; }
    .status-wait { background: #fffbe6; color: #d48806; border: 1px solid #ffe58f; }
    .status-testing { background: #e6f4ff; color: #0958d9; border: 1px solid #91caff; }
    .status-done { background: #f6ffed; color: #389e0d; border: 1px solid #b7eb8f; }
    .status-hold { background: #fff0f6; color: #c41d7f; border: 1px solid #ffadd2; }
    
    .btn-edit { padding: 4px 10px; font-size: 12px; background: #fff; color: #1677ff; border: 1px solid #1677ff; border-radius: 4px; cursor: pointer; }
    .btn-edit:hover { background: #e6f4ff; }

    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
    .modal-content { background: #fff; padding: 24px; border-radius: 8px; width: 90%; max-width: 600px; max-height: 90vh; overflow-y: auto; }
    .modal h2 { margin-top: 0; font-size: 18px; margin-bottom: 16px; }
    .modal-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
    .btn-cancel { background: #fff; color: #555; border: 1px solid #d9d9d9; }
    .btn-cancel:hover { background: #f5f5f5; }

    .message { padding: 10px; border-radius: 6px; margin-bottom: 16px; display: none; text-align: center; font-size: 14px; }
    .msg-success { background: #f6ffed; color: #389e0d; border: 1px solid #b7eb8f; display: block; }
    .msg-error { background: #fff1f0; color: #cf1322; border: 1px solid #ffa39e; display: block; }
  </style>
</head>
<body>
  <div class="container">
    <h1>💻 SITRI-SIPH 晶圆流转系统</h1>
    
    <div class="tabs">
      <div class="tab active" onclick="switchTab('pie')">📦 PIE 出货登记</div>
      <div class="tab" onclick="switchTab('tester')">🔬 实验室流转看板</div>
    </div>

    <div id="msg" class="message"></div>

    <!-- PIE 登记端 -->
    <div id="tab-pie" class="content active">
      <div class="form-grid">
        <div class="form-group"><label>Mask *</label><input type="text" id="pie-mask" placeholder="如 ESP015"></div>
        <div class="form-group"><label>Lot</label><input type="text" id="pie-lot" placeholder="如 E220201"></div>
        <div class="form-group"><label>Wafer</label><input type="text" id="pie-wafer" placeholder="如 S5"></div>
        <div class="form-group"><label>刻号</label><input type="text" id="pie-etchId" placeholder="如 F227TLS10331CG3"></div>
        <div class="form-group"><label>出片时间</label><input type="date" id="pie-shipDate"></div>
        <div class="form-group"><label>PIE 负责人</label><input type="text" id="pie-name" placeholder="您的名字"></div>
      </div>
      <div class="form-grid" style="grid-template-columns: 1fr;">
        <div class="form-group"><label>流片情况 (remarks)</label><input type="text" id="pie-remarks" placeholder="如 modulator wafer,掺杂1"></div>
        <div class="form-group"><label>测试器件 / 需求 *</label><textarea id="pie-testReq" placeholder="如 C波段调制器效率测试、插损测试"></textarea></div>
      </div>
      <div style="text-align: right; margin-top: 10px;">
        <button onclick="submitPIE()">提交发货登记</button>
      </div>
    </div>

    <!-- Tester 看板端 -->
    <div id="tab-tester" class="content">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>出片时间</th>
              <th>Mask</th>
              <th>Lot/Wafer</th>
              <th>刻号</th>
              <th>测试需求</th>
              <th>状态</th>
              <th>负责人</th>
              <th>存放位置</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="tester-tbody">
            <tr><td colspan="9" style="text-align:center; color:#999;">加载中...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- 测试人员更新弹窗 -->
  <div class="modal" id="updateModal">
    <div class="modal-content">
      <h2>更新测试进度</h2>
      <input type="hidden" id="upd-id">
      <div class="form-grid">
        <div class="form-group"><label>测试负责人</label><input type="text" id="upd-testerName" placeholder="您的名字"></div>
        <div class="form-group"><label>状态</label>
          <select id="upd-status">
            <option value="待测试">待测试</option>
            <option value="测试中">测试中</option>
            <option value="完成">完成</option>
            <option value="Hold">Hold</option>
            <option value="异常">测试异常</option>
          </select>
        </div>
        <div class="form-group"><label>测试开始时间</label><input type="date" id="upd-startDate"></div>
        <div class="form-group"><label>测试完成时间</label><input type="date" id="upd-endDate"></div>
        <div class="form-group"><label>存放位置</label><input type="text" id="upd-location" placeholder="如 晶圆间、氮气柜、已寄出"></div>
      </div>
      <div class="form-group" style="margin-top: 16px;">
        <label>测试情况 / 备注</label>
        <textarea id="upd-notes" placeholder="填写测试结果或数据简析"></textarea>
      </div>
      <div class="modal-footer">
        <button class="btn-cancel" onclick="closeModal()">取消</button>
        <button onclick="submitUpdate()">保存更新</button>
      </div>
    </div>
  </div>

  <script>
    const API_URL = '/.netlify/functions/wafers';
    let waferData = [];

    window.addEventListener('DOMContentLoaded', () => {
      loadData();
      document.getElementById('pie-shipDate').valueAsDate = new Date();
    });

    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
      document.querySelector(`.tab[onclick="switchTab('${tab}')"]`).classList.add('active');
      document.getElementById(`tab-${tab}`).classList.add('active');
      if(tab === 'tester') loadData();
    }

    function showMsg(text, type) {
      const el = document.getElementById('msg');
      el.textContent = text;
      el.className = 'message msg-' + type;
      setTimeout(() => el.className = 'message', 3000);
    }

    async function loadData() {
      const tbody = document.getElementById('tester-tbody');
      tbody.innerHTML = '<tr><td colspan="9" style="text-align:center; color:#999;">加载中...</td></tr>';
      try {
        const res = await fetch(API_URL);
        waferData = await res.json();
        renderTable();
      } catch (e) {
        tbody.innerHTML = '<tr><td colspan="9" style="text-align:center; color:red;">加载失败，请检查网络</td></tr>';
      }
    }

    function renderTable() {
      const tbody = document.getElementById('tester-tbody');
      if (!waferData || waferData.length === 0) {
        tbody.innerHTML = '<tr><td colspan="9" style="text-align:center; color:#999;">暂无流转记录</td></tr>';
        return;
      }

      tbody.innerHTML = waferData.map(item => {
        let badgeClass = 'status-wait';
        if (item.status === '测试中') badgeClass = 'status-testing';
        if (item.status === '完成') badgeClass = 'status-done';
        if (item.status === 'Hold' || item.status === '异常') badgeClass = 'status-hold';

        return `
          <tr>
            <td>${item.shipDate}</td>
            <td><strong>${item.mask}</strong></td>
            <td>${item.lot ? item.lot + ' / ' : ''}${item.wafer}</td>
            <td>${item.etchId}</td>
            <td style="max-width: 200px; white-space: normal;">${item.testReq}</td>
            <td><span class="badge ${badgeClass}">${item.status}</span></td>
            <td>${item.testerName || '-'}</td>
            <td>${item.location || '-'}</td>
            <td><button class="btn-edit" onclick="openUpdateModal('${item.id}')">更新</button></td>
          </tr>
        `;
      }).join('');
    }

    async function submitPIE() {
      const mask = document.getElementById('pie-mask').value.trim();
      const testReq = document.getElementById('pie-testReq').value.trim();
      if (!mask || !testReq) {
        return showMsg('Mask 和 测试需求 不能为空', 'error');
      }

      const payload = {
        action: 'create',
        mask,
        lot: document.getElementById('pie-lot').value.trim(),
        wafer: document.getElementById('pie-wafer').value.trim(),
        etchId: document.getElementById('pie-etchId').value.trim(),
        remarks: document.getElementById('pie-remarks').value.trim(),
        testReq,
        shipDate: document.getElementById('pie-shipDate').value,
        pieName: document.getElementById('pie-name').value.trim()
      };

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const result = await res.json();
        if (result.success) {
          showMsg(result.message, 'success');
          ['pie-mask', 'pie-lot', 'pie-wafer', 'pie-etchId', 'pie-remarks', 'pie-testReq'].forEach(id => document.getElementById(id).value = '');
          switchTab('tester');
        } else {
          showMsg(result.message, 'error');
        }
      } catch (e) {
        showMsg('网络错误，请重试', 'error');
      }
    }

    function openUpdateModal(id) {
      const item = waferData.find(x => x.id === id);
      if (!item) return;

      document.getElementById('upd-id').value = item.id;
      document.getElementById('upd-testerName').value = item.testerName || '';
      document.getElementById('upd-status').value = item.status || '待测试';
      document.getElementById('upd-startDate').value = item.testStartDate || '';
      document.getElementById('upd-endDate').value = item.testEndDate || '';
      document.getElementById('upd-location').value = item.location || '';
      document.getElementById('upd-notes').value = item.notes || '';

      document.getElementById('updateModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('updateModal').style.display = 'none';
    }

    async function submitUpdate() {
      const payload = {
        action: 'update',
        id: document.getElementById('upd-id').value,
        testerName: document.getElementById('upd-testerName').value.trim(),
        status: document.getElementById('upd-status').value,
        testStartDate: document.getElementById('upd-startDate').value,
        testEndDate: document.getElementById('upd-endDate').value,
        location: document.getElementById('upd-location').value.trim(),
        notes: document.getElementById('upd-notes').value.trim()
      };

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const result = await res.json();
        if (result.success) {
          closeModal();
          showMsg(result.message, 'success');
          loadData();
        } else {
          alert(result.message);
        }
      } catch (e) {
        alert('网络错误，请重试');
      }
    }
  </script>
</body>
</html>
