<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SITRI-SIPH 晶圆流转系统</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; display: flex; justify-content: center; min-height: 100vh; }
    .container { background: #fff; max-width: 98vw; width: 100%; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); padding: 28px; }
    h1 { font-size: 24px; text-align: center; margin-bottom: 24px; color: #1a1a1a; }
    .tabs { display: flex; border-bottom: 2px solid #e8e8e8; margin-bottom: 24px; }
    .tab { padding: 12px 24px; cursor: pointer; font-size: 16px; font-weight: 600; color: #666; border-bottom: 2px solid transparent; margin-bottom: -2px; }
    .tab.active { color: #1677ff; border-bottom-color: #1677ff; }
    .content { display: none; }
    .content.active { display: block; }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 20px; }
    .form-group { display: flex; flex-direction: column; }
    label { font-size: 13px; color: #555; margin-bottom: 6px; font-weight: 500; }
    label span { color: red; }
    input, select, textarea { padding: 10px; border: 1px solid #d9d9d9; border-radius: 6px; font-size: 14px; outline: none; }
    input:focus, select:focus, textarea:focus { border-color: #1677ff; }
    button { padding: 10px 20px; background: #1677ff; color: #fff; border: none; border-radius: 6px; font-size: 15px; cursor: pointer; }
    button:hover { background: #0958d9; }
    
    .search-bar { margin-bottom: 16px; display: flex; gap: 10px; align-items: center; }
    .search-bar input { flex: 1; padding: 12px 16px; border: 2px solid #e8e8e8; border-radius: 8px; font-size: 15px; transition: border 0.2s; }
    .search-bar input:focus { border-color: #1677ff; }
    .search-bar button { background: #fff; color: #555; border: 1px solid #d9d9d9; padding: 12px 20px; }
    .search-bar button:hover { background: #f5f5f5; }

    .table-wrap { width: 100%; overflow-x: auto; border: 1px solid #e8e8e8; border-radius: 8px; background: #fff; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: left; min-width: 2300px; }
    th, td { padding: 12px 10px; border-bottom: 1px solid #f0f0f0; vertical-align: top; }
    th { background: #fafafa; font-weight: 600; color: #333; white-space: nowrap; position: sticky; top: 0; z-index: 1; }
    tr:hover { background: #fcfcfc; }
    
    th:nth-child(1) { width: 100px; } th:nth-child(2) { width: 120px; } th:nth-child(3) { width: 120px; }
    th:nth-child(4) { width: 120px; } th:nth-child(5) { width: 150px; } th:nth-child(6) { width: 150px; }
    th:nth-child(7) { width: 90px; }  th:nth-child(8) { width: 180px; } th:nth-child(9) { width: 90px; }
    th:nth-child(10) { width: 90px; } th:nth-child(11) { width: 80px; } th:nth-child(12) { width: 100px; }
    th:nth-child(13) { width: 90px; } th:nth-child(14) { width: 80px; } th:nth-child(15) { width: 80px; }
    th:nth-child(16) { width: 100px; } th:nth-child(17) { width: 180px; } 

    .ship-date { color: #0958d9; font-weight: 600; background: #e6f4ff; padding: 4px 8px; border-radius: 4px; display: inline-block; }
    .link-btn { color: #1677ff; text-decoration: none; font-weight: bold; display: inline-block; padding: 2px 6px; border: 1px solid #1677ff; border-radius: 4px; font-size: 12px; background: #e6f4ff; transition: all 0.2s; }
    .link-btn:hover { background: #1677ff; color: #fff; }

    .badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; white-space: nowrap; }
    .status-default { background: #fffbe6; color: #d48806; border: 1px solid #ffe58f; }
    .status-testing { background: #e6f4ff; color: #0958d9; border: 1px solid #91caff; }
    .status-done { background: #f6ffed; color: #389e0d; border: 1px solid #b7eb8f; }
    .status-hold { background: #fff0f6; color: #c41d7f; border: 1px solid #ffadd2; }
    .status-error { background: #fff1f0; color: #cf1322; border: 1px solid #ffa39e; }
    
    .btn-edit { padding: 4px 8px; font-size: 12px; border-radius: 4px; cursor: pointer; white-space: nowrap; margin-right: 4px; margin-bottom: 4px; }
    .btn-tester { background: #fff; color: #1677ff; border: 1px solid #1677ff; }
    .btn-pie { background: #fff; color: #fa8c16; border: 1px solid #fa8c16; }
    
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
    .modal-content { background: #fff; padding: 24px; border-radius: 8px; width: 90%; max-width: 700px; max-height: 90vh; overflow-y: auto; }
    .modal h2 { margin-top: 0; font-size: 18px; margin-bottom: 16px; }
    .modal-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
    .btn-cancel { background: #fff; color: #555; border: 1px solid #d9d9d9; }
    .message { padding: 10px; border-radius: 6px; margin-bottom: 16px; display: none; text-align: center; font-size: 14px; }
    .msg-success { background: #f6ffed; color: #389e0d; border: 1px solid #b7eb8f; display: block; }
    .msg-error { background: #fff1f0; color: #cf1322; border: 1px solid #ffa39e; display: block; }
    .import-box { margin-bottom: 20px; padding: 15px; background: #f6ffed; border: 1px solid #b7eb8f; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; }
    .import-box label { font-weight: bold; color: #389e0d; font-size: 14px; }
    .note-text { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; font-size: 12px; color: #666; }
  </style>
</head>
<body>
  <div class="container">
    <h1>💻 SITRI-SIPH 晶圆流转系统</h1>
    
    <div class="tabs">
      <div class="tab active" onclick="switchTab('pie')">📦 PIE 出货登记</div>
      <div class="tab" onclick="switchTab('tester')">🔬 实验室流转看板</div>
    </div>

    <div id="msg" class="message"></div>

    <div id="tab-pie" class="content active">
      <div class="import-box">
        <div>
          <label>📦 批量导入历史数据（仅首次导入）</label>
          <input type="file" id="batchFile" accept=".json" style="display: block; margin-top: 10px;" onchange="handleBatchImport(event)">
          <div id="batchStatus" style="margin-top: 8px; font-size: 13px; color: #555;"></div>
        </div>
      </div>
      
      <div class="form-grid">
        <div class="form-group"><label>MASK <span>*</span></label><input type="text" id="pie-mask"></div>
        <div class="form-group"><label>LOT <span>*</span></label><input type="text" id="pie-lot"></div>
        <div class="form-group"><label>WAFER <span>*</span></label><input type="text" id="pie-wafer"></div>
        <div class="form-group"><label>出片时间 <span>*</span></label><input type="date" id="pie-shipDate"></div>
        <div class="form-group"><label>PIE负责人 <span>*</span></label><input type="text" id="pie-name"></div>
      </div>
      <div class="form-grid" style="grid-template-columns: 1fr;">
        <div class="form-group"><label>remarks <span>*</span></label><input type="text" id="pie-remarks"></div>
        <div class="form-group"><label>测试内容 <span>*</span></label><textarea id="pie-testReq"></textarea></div>
        <div class="form-group"><label>LOT 报告链接（选填）</label><input type="text" id="pie-report" placeholder="粘贴包含 http 的链接即可"></div>
      </div>
      <div style="text-align: right; margin-top: 10px;">
        <button onclick="submitPIE()">提交发货登记</button>
      </div>
    </div>

    <div id="tab-tester" class="content">
      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="🔍 搜索 MASK、LOT、WAFER、负责人或备注（例如输入 SMP032）..." oninput="handleSearch()">
        <button onclick="clearSearch()">清空</button>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>出片时间</th><th>MASK</th><th>LOT</th><th>WAFER</th><th>remarks</th><th>测试内容</th>
              <th>LOT报告</th>
              <th>测试时间</th><th>测试情况</th><th>测试负责人</th><th>PIE负责人</th><th>是否划片</th><th>存放位置</th><th>晶圆状态</th><th>完成时间</th>
              <th>测试报告</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="tester-tbody">
            <tr><td colspan="17" style="text-align:center; color:#999;">加载中...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- 弹窗1：Tester 更新测试进度 -->
  <div class="modal" id="updateModal">
    <div class="modal-content">
      <h2>更新测试进度</h2>
      <input type="hidden" id="upd-id">
      <div class="form-grid">
        <div class="form-group"><label>测试负责人</label><input type="text" id="upd-testerName" placeholder="您的名字"></div>
        <div class="form-group"><label>晶圆状态</label>
          <select id="upd-status">
            <option value="待测试">待测试</option><option value="待分析">待分析</option><option value="测试中">测试中</option>
            <option value="完成">完成</option><option value="分析数据excel">分析数据excel</option><option value="报告PPT">报告PPT</option>
            <option value="Hold">Hold</option><option value="测试异常">测试异常</option>
          </select>
        </div>
        <div class="form-group"><label>是否划片</label>
          <select id="upd-isCut"><option value="">请选择</option><option value="是">是</option><option value="否">否</option></select>
        </div>
        <div class="form-group"><label>测试时间</label><input type="date" id="upd-startDate"></div>
        <div class="form-group"><label>完成时间</label><input type="date" id="upd-endDate"></div>
        <div class="form-group">
          <label>存放位置</label>
          <select id="upd-location">
            <option value="">请选择存放位置</option>
          </select>
        </div>
      </div>
      <div class="form-group" style="margin-top: 16px;"><label>测试情况</label><textarea id="upd-notes"></textarea></div>
      <div class="form-group" style="margin-top: 16px;"><label>测试报告链接（选填）</label><input type="text" id="upd-testerReport" placeholder="粘贴包含 http 的链接即可"></div>
      <div class="modal-footer">
        <button class="btn-cancel" onclick="closeModal('updateModal')">取消</button>
        <button onclick="submitUpdate()">保存更新</button>
      </div>
    </div>
  </div>

  <!-- 弹窗2：PIE 修改填写错误的信息 -->
  <div class="modal" id="pieEditModal">
    <div class="modal-content">
      <h2>修改登记信息 (PIE)</h2>
      <input type="hidden" id="edit-pie-id">
      <div class="form-grid">
        <div class="form-group"><label>MASK <span>*</span></label><input type="text" id="edit-pie-mask"></div>
        <div class="form-group"><label>LOT <span>*</span></label><input type="text" id="edit-pie-lot"></div>
        <div class="form-group"><label>WAFER <span>*</span></label><input type="text" id="edit-pie-wafer"></div>
        <div class="form-group"><label>出片时间 <span>*</span></label><input type="date" id="edit-pie-shipDate"></div>
        <div class="form-group"><label>PIE负责人 <span>*</span></label><input type="text" id="edit-pie-name"></div>
      </div>
      <div class="form-grid" style="grid-template-columns: 1fr;">
        <div class="form-group"><label>remarks <span>*</span></label><input type="text" id="edit-pie-remarks"></div>
        <div class="form-group"><label>测试内容 <span>*</span></label><textarea id="edit-pie-testReq"></textarea></div>
        <div class="form-group"><label>LOT 报告链接（选填）</label><input type="text" id="edit-pie-report"></div>
      </div>
      <div class="modal-footer">
        <button class="btn-cancel" onclick="closeModal('pieEditModal')">取消</button>
        <button onclick="submitPieEdit()" style="background: #fa8c16;">保存修改</button>
      </div>
    </div>
  </div>

  <script>
    // 请求你自己的 Vercel 代理接口，不再直接连 JSONBin
    const API_URL = '/api/jsonbin';

    let waferData = []; 
    let currentSearch = ''; 

    const fixedLocations = [
      "2F氮气柜", "返回fab", "FIB", "寄出"
    ];
    for (let i = 1; i <= 3; i++) fixedLocations.push(`D区-01架-0${i}层`);
    for (let i = 1; i <= 3; i++) fixedLocations.push(`D区-02架-0${i}层`);
    for (let i = 1; i <= 5; i++) fixedLocations.push(`C区-03架-0${i}层`);

    window.addEventListener('DOMContentLoaded', () => {
      const locSelect = document.getElementById('upd-location');
      locSelect.innerHTML = '<option value="">请选择存放位置</option>';
      fixedLocations.forEach(loc => {
        let opt = document.createElement('option');
        opt.value = loc;
        opt.textContent = loc;
        locSelect.appendChild(opt);
      });

      loadData();
      document.getElementById('pie-shipDate').valueAsDate = new Date();
    });

    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
      document.querySelector(`.tab[onclick="switchTab('${tab}')"]`).classList.add('active');
      document.getElementById(`tab-${tab}`).classList.add('active');
      if(tab === 'tester') loadData();
    }

    function showMsg(text, type) {
      const el = document.getElementById('msg');
      el.textContent = text;
      el.className = 'message msg-' + type;
      setTimeout(() => el.className = 'message', 3000);
    }

    async function loadData() {
      const tbody = document.getElementById('tester-tbody');
      tbody.innerHTML = '<tr><td colspan="17" style="text-align:center; color:#999;">加载中...</td></tr>';
      try {
        // 🟢 修改点 1：删掉 headers 和 /latest
        const res = await fetch(`${API_URL}?_t=${Date.now()}`);
        if (!res.ok) throw new Error(`获取数据失败: ${res.status}`);
        const json = await res.json();
        waferData = Array.isArray(json.record) ? json.record : [];
        waferData.sort((a, b) => (b.shipDate || '').localeCompare(a.shipDate || ''));
        renderTable();
      } catch (e) {
        tbody.innerHTML = `<tr><td colspan="17" style="text-align:center; color:red;">加载失败: ${e.message}</td></tr>`;
      }
    }

    function handleSearch() {
      currentSearch = document.getElementById('searchInput').value.toLowerCase().trim();
      renderTable();
    }

    function clearSearch() {
      document.getElementById('searchInput').value = '';
      currentSearch = '';
      renderTable();
    }

    function renderTable() {
      const tbody = document.getElementById('tester-tbody');
      if (!waferData || waferData.length === 0) {
        tbody.innerHTML = '<tr><td colspan="17" style="text-align:center; color:#999;">暂无流转记录</td></tr>';
        return;
      }

      let dataToRender = waferData;
      if (currentSearch) {
        dataToRender = waferData.filter(item => {
          const matchMask = (item.mask || '').toLowerCase().includes(currentSearch);
          const matchLot = (item.lot || '').toLowerCase().includes(currentSearch);
          const matchWafer = (item.wafer || '').toLowerCase().includes(currentSearch);
          const matchRemarks = (item.remarks || '').toLowerCase().includes(currentSearch);
          const matchTestReq = (item.testReq || '').toLowerCase().includes(currentSearch);
          const matchTester = (item.testerName || '').toLowerCase().includes(currentSearch);
          const matchPie = (item.pieName || '').toLowerCase().includes(currentSearch);
          const matchNotes = (item.testNotes || '').toLowerCase().includes(currentSearch);
          return matchMask || matchLot || matchWafer || matchRemarks || matchTestReq || matchTester || matchPie || matchNotes;
        });
      }

      if (dataToRender.length === 0) {
        tbody.innerHTML = '<tr><td colspan="17" style="text-align:center; color:#999;">没有找到匹配的记录</td></tr>';
        return;
      }

      tbody.innerHTML = dataToRender.map((item) => {
        const originalIndex = waferData.indexOf(item);

        let badgeClass = 'status-default';
        if (item.status === '测试中') badgeClass = 'status-testing';
        if (['完成', '报告PPT', '分析数据excel'].includes(item.status)) badgeClass = 'status-done';
        if (item.status === 'Hold') badgeClass = 'status-hold';
        if (item.status === '测试异常') badgeClass = 'status-error';

        const pieReportHtml = item.pieReport && item.pieReport.startsWith('http') 
          ? `<a href="${item.pieReport}" target="_blank" class="link-btn">📄 查看</a>` : '-';
        const testerReportHtml = item.testerReport && item.testerReport.startsWith('http') 
          ? `<a href="${item.testerReport}" target="_blank" class="link-btn">📄 查看</a>` : '-';

        return `
          <tr>
            <td><span class="ship-date">${item.shipDate || '-'}</span></td>
            <td><strong>${item.mask || '-'}</strong></td>
            <td>${item.lot || '-'}</td>
            <td>${item.wafer || '-'}</td>
            <td><div class="note-text" title="${item.remarks || ''}">${item.remarks || '-'}</div></td>
            <td><div class="note-text" title="${item.testReq || ''}">${item.testReq || '-'}</div></td>
            <td>${pieReportHtml}</td>
            <td>${item.testStartDate || '-'}</td>
            <td><div class="note-text" title="${item.testNotes || ''}">${item.testNotes || '-'}</div></td>
            <td>${item.testerName || '-'}</td>
            <td>${item.pieName || '-'}</td>
            <td>${item.isCut || '-'}</td>
            <td>${item.location || '-'}</td>
            <td><span class="badge ${badgeClass}">${item.status || '待测试'}</span></td>
            <td>${item.testEndDate || '-'}</td>
            <td>${testerReportHtml}</td>
            <td>
              <button class="btn-edit btn-tester" onclick="openUpdateModal(${originalIndex})">测试更新</button>
              <button class="btn-edit btn-pie" onclick="openPieEditModal(${originalIndex})">改PIE信息</button>
            </td>
          </tr>
        `;
      }).join('');
    }

    async function submitPIE() {
      const newRecord = {
        id: Date.now().toString(),
        mask: document.getElementById('pie-mask').value.trim(),
        lot: document.getElementById('pie-lot').value.trim(),
        wafer: document.getElementById('pie-wafer').value.trim(),
        remarks: document.getElementById('pie-remarks').value.trim(),
        testReq: document.getElementById('pie-testReq').value.trim(),
        shipDate: document.getElementById('pie-shipDate').value,
        pieName: document.getElementById('pie-name').value.trim(),
        pieReport: document.getElementById('pie-report').value.trim(),
        testerReport: '', testerName: '', testStartDate: '', testEndDate: '', status: '待测试', location: '', isCut: '', testNotes: ''
      };

      if (!newRecord.mask || !newRecord.lot || !newRecord.wafer || !newRecord.shipDate || !newRecord.pieName || !newRecord.remarks || !newRecord.testReq) {
        return showMsg('请填写所有带 * 的必填项', 'error');
      }

      try {
        // 🟢 修改点 2：GET 请求删掉 headers 和 /latest
        const getRes = await fetch(`${API_URL}?_t=${Date.now()}`);
        if (!getRes.ok) throw new Error(`获取失败: ${getRes.status}`);
        const getJson = await getRes.json();
        let list = Array.isArray(getJson.record) ? getJson.record : [];
        list.push(newRecord);

        // 🟢 修改点 3：PUT 请求删掉 X-Access-Key
        const putRes = await fetch(API_URL, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(list)
        });
        if (!putRes.ok) throw new Error(`提交失败: ${putRes.status}`);

        showMsg('提交成功', 'success');
        ['pie-mask', 'pie-lot', 'pie-wafer', 'pie-remarks', 'pie-testReq', 'pie-report'].forEach(id => document.getElementById(id).value = '');
        switchTab('tester');
      } catch (e) {
        showMsg(e.message, 'error');
      }
    }

    function openUpdateModal(index) {
      const item = waferData[index];
      document.getElementById('upd-id').value = index;
      document.getElementById('upd-testerName').value = item.testerName || '';
      document.getElementById('upd-status').value = item.status || '待测试';
      document.getElementById('upd-isCut').value = item.isCut || '';
      document.getElementById('upd-startDate').value = item.testStartDate || '';
      document.getElementById('upd-endDate').value = item.testEndDate || '';
      document.getElementById('upd-testerReport').value = item.testerReport || '';
      
      const locSelect = document.getElementById('upd-location');
      Array.from(locSelect.options).forEach(opt => {
         if (opt.value !== "" && !fixedLocations.includes(opt.value)) opt.remove();
      });
      if (item.location && !Array.from(locSelect.options).some(opt => opt.value === item.location)) {
        let newOpt = document.createElement('option');
        newOpt.value = item.location; newOpt.textContent = item.location + " (历史)";
        locSelect.appendChild(newOpt);
      }
      locSelect.value = item.location || '';

      document.getElementById('upd-notes').value = item.testNotes || '';
      document.getElementById('updateModal').style.display = 'flex';
    }

    async function submitUpdate() {
      const index = document.getElementById('upd-id').value;
      waferData[index].testerName = document.getElementById('upd-testerName').value.trim();
      waferData[index].status = document.getElementById('upd-status').value;
      waferData[index].isCut = document.getElementById('upd-isCut').value;
      waferData[index].testStartDate = document.getElementById('upd-startDate').value;
      waferData[index].testEndDate = document.getElementById('upd-endDate').value;
      waferData[index].location = document.getElementById('upd-location').value;
      waferData[index].testNotes = document.getElementById('upd-notes').value.trim();
      waferData[index].testerReport = document.getElementById('upd-testerReport').value.trim();

      try {
        // 🟢 修改点 4：PUT 请求删掉 X-Access-Key
        const res = await fetch(API_URL, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(waferData)
        });
        if (!res.ok) throw new Error(`更新失败: ${res.status}`);
        
        closeModal('updateModal');
        showMsg('测试进度更新成功', 'success');
        loadData();
      } catch (e) {
        alert(e.message);
      }
    }

    function openPieEditModal(index) {
      const item = waferData[index];
      document.getElementById('edit-pie-id').value = index;
      document.getElementById('edit-pie-mask').value = item.mask || '';
      document.getElementById('edit-pie-lot').value = item.lot || '';
      document.getElementById('edit-pie-wafer').value = item.wafer || '';
      document.getElementById('edit-pie-shipDate').value = item.shipDate || '';
      document.getElementById('edit-pie-name').value = item.pieName || '';
      document.getElementById('edit-pie-remarks').value = item.remarks || '';
      document.getElementById('edit-pie-testReq').value = item.testReq || '';
      document.getElementById('edit-pie-report').value = item.pieReport || '';
      document.getElementById('pieEditModal').style.display = 'flex';
    }

    async function submitPieEdit() {
      const index = document.getElementById('edit-pie-id').value;
      
      const mask = document.getElementById('edit-pie-mask').value.trim();
      const lot = document.getElementById('edit-pie-lot').value.trim();
      const wafer = document.getElementById('edit-pie-wafer').value.trim();
      const shipDate = document.getElementById('edit-pie-shipDate').value;
      const pieName = document.getElementById('edit-pie-name').value.trim();
      const remarks = document.getElementById('edit-pie-remarks').value.trim();
      const testReq = document.getElementById('edit-pie-testReq').value.trim();

      if (!mask || !lot || !wafer || !shipDate || !pieName || !remarks || !testReq) {
        alert("请填写所有带 * 的必填项！");
        return;
      }

      waferData[index].mask = mask;
      waferData[index].lot = lot;
      waferData[index].wafer = wafer;
      waferData[index].shipDate = shipDate;
      waferData[index].pieName = pieName;
      waferData[index].remarks = remarks;
      waferData[index].testReq = testReq;
      waferData[index].pieReport = document.getElementById('edit-pie-report').value.trim();

      try {
        // 🟢 修改点 5：PUT 请求删掉 X-Access-Key
        const res = await fetch(API_URL, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(waferData)
        });
        if (!res.ok) throw new Error(`修改失败: ${res.status}`);
        
        closeModal('pieEditModal');
        showMsg('登记信息修改成功', 'success');
        loadData();
      } catch (e) {
        alert(e.message);
      }
    }

    function closeModal(modalId) {
      document.getElementById(modalId).style.display = 'none';
    }

    async function handleBatchImport(event) {
      const file = event.target.files[0];
      if (!file) return;
      const statusEl = document.getElementById('batchStatus');
      statusEl.textContent = '正在读取文件...';
      
      const reader = new FileReader();
      reader.onload = async (e) => {
        try {
          const items = JSON.parse(e.target.result);
          statusEl.textContent = `读取成功，共 ${items.length} 条。正在上传...`;
          
          // 🟢 修改点 6：GET 请求删掉 headers 和 /latest
          const getRes = await fetch(`${API_URL}?_t=${Date.now()}`);
          if (!getRes.ok) throw new Error(`获取失败: ${getRes.status}`);
          const getJson = await getRes.json();
          let list = Array.isArray(getJson.record) ? getJson.record : [];
          
          list = list.concat(items);
          
          // 🟢 修改点 7：PUT 请求删掉 X-Access-Key
          const putRes = await fetch(API_URL, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(list)
          });
          if (!putRes.ok) throw new Error(`上传失败，可能文件超限(${putRes.status})`);

          statusEl.textContent = `🎉 导入成功！共写入 ${items.length} 条记录。`;
          statusEl.style.color = 'green';
          loadData();
        } catch (err) {
          statusEl.textContent = `❌ 导入失败: ${err.message}`;
          statusEl.style.color = 'red';
        }
      };
      reader.readAsText(file);
    }
  </script>
